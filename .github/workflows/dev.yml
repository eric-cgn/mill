# Every push to dev: the host tests and a build, published as the "dev" pre-release on
# GitHub. Each build replaces the last one. Its files are named for the version in
# src/version.h, "-dev-", and the commit, such as Mill-1.7.2-dev-46a0304.hqx, and the
# Mac shows the same version.
name: Dev build

on:
  push:
    branches: [dev]

# Only the newest build matters
concurrency:
  group: dev
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Version
        run: |
          v=$(sed -n 's/^#define MILL_VERSION "\(.*\)"/\1/p' src/version.h)-dev-$(git rev-parse --short=7 HEAD)
          sed -i "s/^#define MILL_VERSION \".*\"/#define MILL_VERSION \"$v\"/" src/version.h
          sed -i 's/MILL_VERS_MINOR, release,/MILL_VERS_MINOR, development,/' src/mill.r
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Test
        run: tests/run.sh
      - name: Build
        run: ./build.sh
      - name: Release files
        run: python3 tools/release.py
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" --title "Mill $VERSION" \
            --notes "A build of the dev branch, not a release. It is replaced by every change to dev."
