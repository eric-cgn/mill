# Every push to main and every pull request: the host tests and a build, with the
# release files kept as an artifact. A pull request into main fails unless it comes
# from dev: features go into dev, and main only takes dev, as a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Into main only from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "::error::Pull requests into main come from dev. Point this one at dev instead."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Test
        run: tests/run.sh
      - name: Build
        run: ./build.sh
      - name: Release files
        run: python3 tools/release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mill
          path: dist/
