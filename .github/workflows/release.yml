# Every push to main: if src/version.h names a version with no release yet, build Mill,
# tag the commit vX.Y.Z, make a GitHub release with its .hqx, .bin, and .dsk (and the
# Plug-In SDK's .dsk and .zip), and
# rebuild the download site (mill.1in1e6.com) from every release. A push that keeps the
# version does nothing. Run it by hand to rebuild the site alone.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, so two quick landings can't both release the same version
concurrency: release

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: version
        name: A new version?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^#define MILL_VERSION "\(.*\)"/\1/p' src/version.h)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Mill $v is already released"
            echo "new=no" >> "$GITHUB_OUTPUT"
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.version.outputs.new == 'yes'
        run: tests/run.sh
      - name: Build
        if: steps.version.outputs.new == 'yes'
        run: ./build.sh
      - name: Release files
        if: steps.version.outputs.new == 'yes'
        run: python3 tools/release.py
      - name: Plug-In SDK
        if: steps.version.outputs.new == 'yes'
        run: ./build.sh kit
      - name: Release
        if: steps.version.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/site.py notes "$VERSION" > notes.txt
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Mill $VERSION" --notes-file notes.txt

  site:
    needs: release
    if: always() && ((needs.release.result == 'success' && needs.release.outputs.new == 'yes') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The three newest releases' files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/download
          gh release list --limit 100 --exclude-pre-releases --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[:3][] | .tagName' | while read -r tag; do
            gh release download "$tag" --dir site/download --pattern 'Mill-*'
          done
      - name: Page
        run: python3 tools/site.py site site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
