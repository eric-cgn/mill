; Install Mill, made with EUP (https://github.com/eric-cgn/eup). ./build.sh installer copies
; this file into build/installer/stage with the files it names, sets the version lines from
; src/version.h, and runs eup build on it.

[installer]
product = Mill
version = 2.1
get_info = Install Mill 2.1, © 2026 OneInAMillion Software. Freeware.
creator = MiLI
icon = Install icon.bin

[type easy]
label = Easy Install
description_file = Easy Install.txt

[type minimal]
label = Minimal Install
description = Mill only. Plug-Ins can be added later with Custom Install.

[type custom]
label = Custom Install
custom = yes

[group application]
label = Application

[group plugins]
label = Plug-Ins

[group developer]
label = Developer

[component mill]
group = application
label = Mill
description = The web browser.
source = Mill.bin
flags = bundle
types = easy, minimal, custom

[component internet-services]
group = plugins
label = Internet Services
description = Finger, Whois, Dict, Time, FTP, and Gopher.
source = Internet Services.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component smb]
group = plugins
label = SMB
description = Windows and Samba file servers.
source = SMB.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component nfs]
group = plugins
label = NFS
description = Unix file servers.
source = NFS.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component news]
group = plugins
label = News
description = Usenet news.
source = News.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component ldap]
group = plugins
label = LDAP
description = Directory searches.
source = LDAP.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component imap]
group = plugins
label = IMAP
description = Mail on IMAP servers.
source = IMAP.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component image-formats]
group = plugins
label = Image Formats
description = MacPaint, PICT, XBM, BMP, Netpbm, and PNG images.
source = Image Formats.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component archives]
group = plugins
label = Archives
description = Zip, tar, gzip, MacBinary, and BinHex archives.
source = Archives.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component web-fonts]
group = plugins
label = Web Fonts
description = Mill Serif and Mill Mono, Mill's own fonts.
source = Web Fonts.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component sdk]
group = developer
label = Mill Plug-In SDK
description = Files for writing Mill Plug-Ins, for CodeWarrior 4 and MPW 3.4.
source = Mill Plug-In SDK
destination = %chosen%:Mill Plug-In SDK
types = custom

[upgrade]
detect = Mill
remove = %chosen%:Mill Fonts
remove = %chosen%:Mill Fonts Read Me
remove = %chosen%:Mill Plug-Ins:Finger
; 2.0's, built for an older Mill: removed by every type (Easy Install puts in 2.1's)
remove = %chosen%:Mill Plug-Ins:Internet Services
keep = %chosen%:Mill Settings

[layout]
window = 40, 60, 300, 190
place = Mill: 18, 9
place = Mill Plug-Ins: 108, 79
place = Mill Plug-In SDK: 198, 79
